[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-mcp"
version = "0.1.0.dev0"
description = "Self-hosted OAuth-protected MCP service for audited SSH operations"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "asyncssh==2.24.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.31,<1",
  "httpx>=0.27,<1",
  "mcp==2.2.0",
  "PyJWT>=2.10.1,<3",
]

[project.urls]
Homepage = "https://github.com/keeperlink/ssh-mcp"
Source = "https://github.com/keeperlink/ssh-mcp"
Issues = "https://github.com/keeperlink/ssh-mcp/issues"

[project.scripts]
oauth-sessions = "app.oauth_session_cli:main"

[project.optional-dependencies]
dev = [
  "coverage==7.17.0",
  "ruff>=0.11,<1",
  "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
app = ["assets/*.css", "assets/*.js"]

# Python 3.14 is the only supported and validated interpreter.
[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
show_error_codes = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
